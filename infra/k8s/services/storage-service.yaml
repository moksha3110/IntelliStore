apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: intellistore
spec:
  selector:
    app: storage-service
  ports:
    - port: 4003
      targetPort: 4003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: intellistore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      # Disable Kubernetes' legacy Docker-link service env vars: for a Service
      # named e.g. auth-service, k8s would otherwise inject AUTH_SERVICE_PORT=
      # tcp://<clusterIP>:4001, colliding with our own AUTH_SERVICE_PORT (the
      # numeric listen port). We use in-cluster DNS for discovery, so these
      # link vars are unnecessary anyway.
      enableServiceLinks: false
      containers:
        - name: storage-service
          image: intellistore/storage-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          envFrom:
            - configMapRef:
                name: intellistore-config
            - secretRef:
                name: intellistore-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
